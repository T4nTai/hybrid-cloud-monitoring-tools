# =============================================================================
# Telegraf Config — Agent (on-prem VM-A hoặc AWS VM-B/C/D)
# Template này cần sửa <PLACEHOLDERS> bằng IP thực tế
# Hoặc dùng script configure-telegraf.sh để tự động sinh
# =============================================================================

[agent]
  interval = "15s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "2s"
  flush_interval = "10s"
  hostname = "<VM-HOSTNAME>"  # VD: vm-a, vm-b, vm-c, vm-d
  omit_hostname = false

# ---- Output: InfluxDB trên Azure Central ----
[[outputs.influxdb]]
  urls = ["http://<AZURE-CENTRAL-IP>:8086"]
  database = "monitoring"
  username = "admin"
  password = "<INFLUXDB-PASSWORD>"
  timeout = "10s"

# ---- Metrics hệ thống ----
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = true

[[inputs.mem]]

[[inputs.disk]]
  mountpoints = ["/"]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

[[inputs.net]]

[[inputs.system]]

# ---- ĐO HIỆU NĂNG MẠNG (quan trọng nhất) ----
# Ping nhiều target để đo latency, jitter, packet loss, percentile
[[inputs.ping]]
  urls = [
    "<TARGET-VM-IP-1>",        # VD: IP của AWS VM-B nếu đây là on-prem VM-A
    "<AZURE-CENTRAL-IP>"       # Đo latency tới Central luôn
  ]
  count = 20
  interval = "15s"
  ping_interval = 0.2          # 200ms giữa các gói trong 1 lần ping
  method = "native"            # Cần `sudo setcap cap_net_raw+ep /usr/bin/telegraf`
  percentile = [50, 95, 99]
  deadline = 10                # Timeout cho toàn bộ 20 gói

# ---- TCP connection time ----
[[inputs.net_response]]
  protocol = "tcp"
  address = "<TARGET-VM-IP>:80"  # VD: AWS VM-B:80
  timeout = "5s"
  read_timeout = "5s"
  interval = "15s"

# ---- HTTP response time ----
[[inputs.http_response]]
  urls = ["http://<TARGET-VM-IP>/"]
  method = "GET"
  response_timeout = "5s"
  interval = "15s"
