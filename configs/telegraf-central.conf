# =============================================================================
# Telegraf Central Config — Azure Central VM (Docker container)
# Mục đích: Thu thập metrics native từ AWS CloudWatch (optional)
# Cần có IAM role hoặc AWS credentials để gọi CloudWatch API
# =============================================================================

[agent]
  interval = "60s"
  round_interval = true
  metric_batch_size = 1000
  hostname = "central-azure"

# ---- Output: InfluxDB local (trong cùng Docker network) ----
[[outputs.influxdb]]
  urls = ["http://influxdb:8086"]
  database = "monitoring"
  username = "admin"
  password = "${INFLUXDB_PASSWORD}"
  timeout = "10s"

# ---- Thu thập metrics từ AWS CloudWatch ----
# Cần có quyền: cloudwatch:GetMetricData, cloudwatch:ListMetrics, ec2:DescribeInstances
[[inputs.cloudwatch]]
  region = "ap-southeast-1"
  period = "5m"
  delay = "5m"
  interval = "5m"
  namespace = "AWS/EC2"

  [[inputs.cloudwatch.metrics]]
    names = ["CPUUtilization", "NetworkIn", "NetworkOut", "StatusCheckFailed"]
    [[inputs.cloudwatch.metrics.dimensions]]
      name = "InstanceId"
      value = "<AWS-VM-B-INSTANCE-ID>"  # Lấy từ terraform output

# Lặp lại cho VM-C (Tokyo) và VM-D (US-East) nếu có
#  [[inputs.cloudwatch.metrics]]
#    names = ["CPUUtilization", "NetworkIn", "NetworkOut"]
#    [[inputs.cloudwatch.metrics.dimensions]]
#      name = "InstanceId"
#      value = "<AWS-VM-C-INSTANCE-ID>"

# ---- Internal metrics (monitor Telegraf itself) ----
[[inputs.internal]]

# ---- Docker stats (monitor InfluxDB + Chronograf containers) ----
[[inputs.docker]]
  endpoint = "unix:///var/run/docker.sock"
  gather_services = false
  container_names = ["influxdb", "chronograf"]
