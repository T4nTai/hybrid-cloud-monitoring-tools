# =============================================================================
# Docker Compose — TICK Stack cho Azure Central (Neutral Observer)
# Components: InfluxDB 1.8 + Chronograf 1.10
# =============================================================================

services:
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=monitoring
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - monitoring
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8086/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  chronograf:
    image: chronograf:1.10
    container_name: chronograf
    restart: always
    ports:
      - "8888:8888"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
    volumes:
      - chronograf-data:/var/lib/chronograf
    networks:
      - monitoring
    depends_on:
      - influxdb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/ping >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Kapacitor — thành phần "K" của TICK stack (xử lý luồng + cảnh báo)
  # Nhận dữ liệu từ InfluxDB, chạy TICKscript, ghi alert ngược vào InfluxDB
  kapacitor:
    image: kapacitor:1.7
    container_name: kapacitor
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAPACITOR_HOSTNAME=kapacitor
      - KAPACITOR_INFLUXDB_0_URLS_0=http://influxdb:8086
      - KAPACITOR_INFLUXDB_0_USERNAME=admin
      - KAPACITOR_INFLUXDB_0_PASSWORD=${INFLUXDB_PASSWORD}
    volumes:
      - kapacitor-data:/var/lib/kapacitor
      - ./kapacitor/tick:/etc/kapacitor/tick:ro
    networks:
      - monitoring
    depends_on:
      influxdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kapacitor list tasks >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  influxdb-data:
  chronograf-data:
  kapacitor-data:

networks:
  monitoring:
    driver: bridge
