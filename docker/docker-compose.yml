# =============================================================================
# Docker Compose — TICK Stack cho Azure Central (Neutral Observer)
# Components: InfluxDB 1.8 + Chronograf 1.10
# =============================================================================

version: '3.8'

services:
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: always
    ports:
      - "8086:8086"
    environment:
      - INFLUXDB_DB=monitoring
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_PASSWORD}
      - INFLUXDB_HTTP_AUTH_ENABLED=true
    volumes:
      - influxdb-data:/var/lib/influxdb
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 30s
      timeout: 10s
      retries: 5

  chronograf:
    image: chronograf:1.10
    container_name: chronograf
    restart: always
    ports:
      - "8888:8888"
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_USERNAME=admin
      - INFLUXDB_PASSWORD=${INFLUXDB_PASSWORD}
    volumes:
      - chronograf-data:/var/lib/chronograf
    networks:
      - monitoring
    depends_on:
      - influxdb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8888/ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Telegraf Central (optional) - thu thập metrics từ CloudWatch (AWS)
  # Bỏ comment nếu muốn thu thập metrics native từ AWS CloudWatch
  # telegraf-central:
  #   image: telegraf:1.29
  #   container_name: telegraf-central
  #   restart: always
  #   volumes:
  #     - ./telegraf-central.conf:/etc/telegraf/telegraf.conf:ro
  #   networks:
  #     - monitoring
  #   depends_on:
  #     - influxdb
  #   environment:
  #     - AWS_REGION=ap-southeast-1
  #     # Dùng IAM role hoặc provide access key qua .env
  #     # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
  #     # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}

volumes:
  influxdb-data:
  chronograf-data:

networks:
  monitoring:
    driver: bridge
